name: Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Publish validated manifest version
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const read = async (path) => {
              const {data} = await github.rest.repos.getContent({owner, repo, path, ref: sha});
              if (Array.isArray(data) || data.encoding !== 'base64') {
                throw new Error(`Expected a base64 file: ${path}`);
              }
              return Buffer.from(data.content, 'base64').toString('utf8');
            };
            const manifest = JSON.parse(await read('custom_components/impuls_fora/manifest.json'));
            const version = manifest.version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error('Expected a stable semantic version in manifest.json');
            }
            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              core.info(`${tag} already exists; no release is changed.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // Never move an existing tag to another commit.
            try {
              const {data} = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (data.object.type !== 'commit' || data.object.sha !== sha) {
                throw new Error(`Existing tag ${tag} does not match the validated commit`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const changelog = await read('CHANGELOG.md');
            const heading = `## ${version}\n`;
            const index = changelog.indexOf(heading);
            if (index < 0) throw new Error(`Missing changelog for ${version}`);
            const section = changelog.slice(index + heading.length).split('\n## ')[0].trim();
            const {data} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: sha,
              name: version, body: section, draft: false, prerelease: false,
              make_latest: 'true'
            });
            core.info(`Published ${data.html_url}`);
